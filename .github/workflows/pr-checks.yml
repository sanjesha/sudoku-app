name: PR checks

on:
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'api/') || github.event.pull_request.changed_files == ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Run backend tests
        working-directory: ./api
        run: ./gradlew test --no-daemon

  frontend-tests:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Type check
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: ./web
        run: npm test -- --run
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_AUTH0_DOMAIN: test.auth0.local
          VITE_AUTH0_CLIENT_ID: test-client-id
          VITE_AUTH0_AUDIENCE: test-audience
